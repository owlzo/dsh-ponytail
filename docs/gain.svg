<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 236" width="720" height="236" role="img" aria-label="Ponytail measured against the same agent without it">
  <rect x="0" y="0" width="720" height="236" rx="12" fill="#f8f9fb"/>
  <rect x="0.5" y="0.5" width="719" height="235" rx="12" fill="none" stroke="#e3e7ee"/>

  <text x="24" y="38" font-family="-apple-system, Segoe UI, system-ui, sans-serif" font-size="16" font-weight="600" fill="#111827">Ponytail against the same agent without it</text>
  <text x="24" y="60" font-family="-apple-system, Segoe UI, system-ui, sans-serif" font-size="12" fill="#6b7280">39 tasks in a real FastAPI + React repo, 5 runs each. The bar is ponytail's share of the no-skill baseline.</text>

  <g font-family="-apple-system, Segoe UI, system-ui, sans-serif" font-size="12">
    <text x="24" y="96" fill="#6b7280">Lines of code</text>
    <rect x="180" y="84" width="420" height="12" rx="6" fill="#e5e7eb"/>
    <rect x="180" y="84" width="197" height="12" rx="6" fill="#1f2937"/>
    <text x="612" y="96" fill="#111827" font-weight="600">47%<tspan fill="#6b7280" font-weight="400"> · −53%</tspan></text>

    <text x="24" y="126" fill="#6b7280">Output tokens</text>
    <rect x="180" y="114" width="420" height="12" rx="6" fill="#e5e7eb"/>
    <rect x="180" y="114" width="231" height="12" rx="6" fill="#1f2937"/>
    <text x="612" y="126" fill="#111827" font-weight="600">55%<tspan fill="#6b7280" font-weight="400"> · −45%</tspan></text>

    <text x="24" y="156" fill="#6b7280">Cost</text>
    <rect x="180" y="144" width="420" height="12" rx="6" fill="#e5e7eb"/>
    <rect x="180" y="144" width="311" height="12" rx="6" fill="#1f2937"/>
    <text x="612" y="156" fill="#111827" font-weight="600">74%<tspan fill="#6b7280" font-weight="400"> · −26%</tspan></text>

    <text x="24" y="186" fill="#6b7280">Time</text>
    <rect x="180" y="174" width="420" height="12" rx="6" fill="#e5e7eb"/>
    <rect x="180" y="174" width="248" height="12" rx="6" fill="#1f2937"/>
    <text x="612" y="186" fill="#111827" font-weight="600">59%<tspan fill="#6b7280" font-weight="400"> · −41%</tspan></text>
  </g>

  <line x1="24" y1="204" x2="696" y2="204" stroke="#e3e7ee"/>
  <text x="24" y="224" font-family="-apple-system, Segoe UI, system-ui, sans-serif" font-size="12" fill="#6b7280">And 98% of risky logic ships with a test, against 68% without ponytail. Measured upstream, in Claude Code.</text>
</svg>
